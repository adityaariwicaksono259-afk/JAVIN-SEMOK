<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokia Text</title>
<link rel="stylesheet" href="/style.css">
<style>
.nk-wrap{max-width:620px;margin:0 auto;padding:20px}
.nk-card{background:rgba(20,25,40,0.65);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px}
.nk-card h2{margin:0 0 6px;color:#fff}
.nk-sub{color:rgba(255,255,255,0.6);font-size:0.85rem;margin-bottom:20px}
.nk-label{display:block;margin:16px 0 6px;font-weight:600;color:#fff}
.nk-input{width:100%;box-sizing:border-box;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px;font:inherit;background:rgba(0,0,0,0.3);color:#fff}
.nk-input:focus{outline:none;border-color:#7c5cff}
.nk-textarea{width:100%;box-sizing:border-box;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px;font:inherit;background:rgba(0,0,0,0.3);color:#fff;min-height:100px;resize:vertical}
.nk-textarea:focus{outline:none;border-color:#7c5cff}
.nk-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nk-btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#9d7cff);color:#fff}
.nk-btn:disabled{opacity:0.6;cursor:not-allowed}
.nk-result{margin-top:20px;padding:16px;border-radius:12px;text-align:center;display:none}
.nk-result.show{display:block}
.nk-result.ok{background:rgba(0,212,170,0.12);border:1.5px solid #00d4aa;color:#00d4aa}
.nk-result.err{background:rgba(255,77,109,0.12);border:1.5px solid #ff4d6d;color:#ff8fa3}
.nk-img{margin-top:16px;max-width:100%;border-radius:12px;display:none}
.nk-img.show{display:block}
.nk-loading{text-align:center;padding:20px;color:rgba(255,255,255,0.6);display:none}
.nk-loading.show{display:block}
.nk-spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,0.15);border-top-color:#7c5cff;border-radius:50%;animation:nk-spin 0.8s linear infinite;margin:0 auto 10px}
@keyframes nk-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
<a href="/tools.html" class="header-btn">← Tools</a>
<h1>📱 Nokia Text</h1>
</header>
<div class="nk-wrap">
<div class="nk-card">
<h2>Nokia Text Generator</h2>
<p class="nk-sub">Buat gambar gaya SMS Nokia jadul</p>
<label class="nk-label">Isi Pesan</label>
<textarea id="nkText" class="nk-textarea" placeholder="Tulis pesan di sini..."></textarea>
<label class="nk-label">Dari</label>
<input id="nkFrom" class="nk-input" type="text" placeholder="Pengirim" value="Javin">
<label class="nk-label">Judul</label>
<input id="nkTitle" class="nk-input" type="text" placeholder="Judul" value="Javin">
<div class="nk-row">
<div>
<label class="nk-label">Tanggal</label>
<input id="nkDate" class="nk-input" type="text" placeholder="08/06/2026">
</div>
<div>
<label class="nk-label">Jam</label>
<input id="nkTime" class="nk-input" type="text" placeholder="12:00">
</div>
</div>
<button id="nkBtn" class="nk-btn">🚀 Buat Gambar</button>
<div id="nkLoading" class="nk-loading"><div class="nk-spinner"></div>Memproses...</div>
<div id="nkResult" class="nk-result"></div>
<img id="nkImg" class="nk-img" alt="Nokia Result">
</div>
</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var btn=$('nkBtn'),text=$('nkText'),from=$('nkFrom'),title=$('nkTitle'),date=$('nkDate'),time=$('nkTime'),result=$('nkResult'),loading=$('nkLoading'),img=$('nkImg');
function showStatus(type,msg){result.className='nk-result show '+type;result.textContent=msg}
function hide(){result.className='nk-result';loading.className='nk-loading';img.className='nk-img'}
// Auto-fill date/time
var now=new Date();
if(!date.value)date.value=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
if(!time.value)time.value=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
btn.onclick=async function(){
var t=text.value.trim();
if(!t){showStatus('err','❌ Isi pesan tidak boleh kosong');return}
hide();loading.className='nk-loading show';btn.disabled=true;btn.textContent='⏳ Memproses...';
try{
var r=await fetch('/api/nokia-proxy?text='+encodeURIComponent(t)+'&from='+encodeURIComponent(from.value||'Javin')+'&date='+encodeURIComponent(date.value||'')+'&time='+encodeURIComponent(time.value||'')+'&title='+encodeURIComponent(title.value||'Javin'));
if(!r.ok)throw new Error('Gagal membuat gambar');
var blob=await r.blob();
var objUrl=URL.createObjectURL(blob);
img.src=objUrl;img.className='nk-img show';
showStatus('ok','✅ Berhasil! Gambar berhasil dibuat');
}catch(e){
showStatus('err','❌ Gagal: '+e.message);
}finally{
btn.disabled=false;btn.textContent='🚀 Buat Gambar';
loading.className='nk-loading';
}
};
})();
</script>
</body>
</html>
