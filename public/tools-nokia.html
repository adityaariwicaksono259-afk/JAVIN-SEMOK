<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokia Text</title>
<link rel="stylesheet" href="/style.css">
<style>
/* === FIX SCROLL & LAYOUT === */
html, body {
  overflow-y: auto !important;
  height: auto !important;
  min-height: 100vh !important;
}
.page {
  display: block !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  padding-bottom: 80px !important;
}
.page-header {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  flex-direction: row !important;
}

.nk-wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 100px;
  display: block;
}
.nk-card {
  background: rgba(20,25,40,0.72);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 18px;
  padding: 26px 22px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  display: block;
}
.nk-card h2 {
  margin: 0 0 8px;
  font-size: 1.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff, #00ffaa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: block;
}
.nk-sub {
  color: rgba(255,255,255,0.6);
  font-size: 0.86rem;
  margin: 0 0 22px;
  line-height: 1.5;
  display: block;
}
.nk-label {
  display: block;
  margin: 18px 0 8px;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
}
.nk-input,
.nk-textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 13px 14px;
  font: inherit;
  font-size: 0.95rem;
  background: rgba(0,0,0,0.35);
  color: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
  display: block;
}
.nk-input:focus,
.nk-textarea:focus {
  outline: none;
  border-color: #7c5cff;
  box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
}
.nk-input::placeholder,
.nk-textarea::placeholder {
  color: rgba(255,255,255,0.35);
}
.nk-textarea {
  min-height: 110px;
  resize: vertical;
  font-family: inherit;
}
.nk-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 4px;
}
@media (max-width: 480px) {
  .nk-row { grid-template-columns: 1fr; }
}
.nk-btn {
  width: 100%;
  margin-top: 22px;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  font: inherit;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  background: linear-gradient(135deg, #7c5cff, #9d7cff);
  color: #fff;
  transition: transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(124,92,255,0.35);
  display: block;
}
.nk-btn:active { transform: scale(0.97); }
.nk-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.nk-btn:hover:not(:disabled) {
  box-shadow: 0 10px 28px rgba(124,92,255,0.5);
  transform: translateY(-2px);
}
.nk-result {
  margin-top: 22px;
  padding: 16px 18px;
  border-radius: 14px;
  text-align: center;
  font-weight: 700;
  font-size: 0.92rem;
  display: none;
  line-height: 1.5;
}
.nk-result.show { display: block; }
.nk-result.ok {
  background: rgba(0,212,170,0.12);
  border: 1.5px solid #00d4aa;
  color: #00ffcc;
}
.nk-result.err {
  background: rgba(255,77,109,0.12);
  border: 1.5px solid #ff4d6d;
  color: #ff8fa3;
}
.nk-img,
.nk-video {
  margin-top: 18px;
  width: 100%;
  max-width: 100%;
  border-radius: 14px;
  display: none;
  border: 1px solid rgba(255,255,255,0.1);
}
.nk-img.show,
.nk-video.show { display: block; }
.nk-dl {
  display: none;
  margin-top: 14px;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, #00d4aa, #00b894);
  color: #001a16;
  font-weight: 800;
  text-decoration: none;
  text-align: center;
  font-size: 0.95rem;
  letter-spacing: 0.3px;
  box-shadow: 0 6px 20px rgba(0,212,170,0.3);
}
.nk-dl.show { display: block; }
.nk-loading {
  text-align: center;
  padding: 22px 0;
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem;
  display: none;
}
.nk-loading.show { display: block; }
.nk-spinner {
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: #7c5cff;
  border-radius: 50%;
  animation: nk-spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes nk-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="page">
<header class="page-header">
<a href="/tools.html" class="header-btn">← Tools</a>
<h1>📱 Nokia Text</h1>
</header>
<div class="nk-wrap">
<div class="nk-card">
<h2>📱 Nokia Text</h2>
<p class="nk-sub">Buat gambar gaya SMS Nokia jadul yang nostalgia</p>
<label class="nk-label">Isi Pesan</label>
<textarea id="nkText" class="nk-textarea" placeholder="Tulis pesan di sini..."></textarea>
<label class="nk-label">Dari</label>
<input id="nkFrom" class="nk-input" type="text" placeholder="Pengirim" value="Javin">
<label class="nk-label">Judul</label>
<input id="nkTitle" class="nk-input" type="text" placeholder="Judul" value="Javin">
<div class="nk-row">
<div>
<label class="nk-label">Tanggal</label>
<input id="nkDate" class="nk-input" type="text" placeholder="16/09/2026">
</div>
<div>
<label class="nk-label">Jam</label>
<input id="nkTime" class="nk-input" type="text" placeholder="12:00">
</div>
</div>
<button id="nkBtn" class="nk-btn">🚀 Buat Gambar</button>
<div id="nkLoading" class="nk-loading"><div class="nk-spinner"></div>Memproses...</div>
<div id="nkResult" class="nk-result"></div>
<img id="nkImg" class="nk-img" alt="Nokia Result">
</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var btn=$('nkBtn'),text=$('nkText'),from=$('nkFrom'),title=$('nkTitle'),date=$('nkDate'),time=$('nkTime'),result=$('nkResult'),loading=$('nkLoading'),img=$('nkImg');
function showStatus(type,msg){result.className='nk-result show '+type;result.textContent=msg}
function hide(){result.className='nk-result';loading.className='nk-loading';img.className='nk-img'}
// Auto-fill date/time
var now=new Date();
if(!date.value)date.value=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
if(!time.value)time.value=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
btn.onclick=async function(){
var t=text.value.trim();
if(!t){showStatus('err','❌ Isi pesan tidak boleh kosong');return}
hide();loading.className='nk-loading show';btn.disabled=true;btn.textContent='⏳ Memproses...';
try{
var r=await fetch('/api/nokia-proxy?text='+encodeURIComponent(t)+'&from='+encodeURIComponent(from.value||'Javin')+'&date='+encodeURIComponent(date.value||'')+'&time='+encodeURIComponent(time.value||'')+'&title='+encodeURIComponent(title.value||'Javin'));
if(!r.ok)throw new Error('Gagal membuat gambar');
var blob=await r.blob();
var objUrl=URL.createObjectURL(blob);
img.src=objUrl;img.className='nk-img show';
showStatus('ok','✅ Berhasil! Gambar berhasil dibuat');
}catch(e){
showStatus('err','❌ Gagal: '+e.message);
}finally{
btn.disabled=false;btn.textContent='🚀 Buat Gambar';
loading.className='nk-loading';
}
};
})();
</script>
</body>
</html>
