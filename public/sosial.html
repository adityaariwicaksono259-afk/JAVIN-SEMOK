<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sosial Anonim - JAVIN SEMOK</title>
<link rel="stylesheet" href="style.css" />
<style>
.sos-page { display: flex; flex-direction: column; min-height: 100dvh; background: var(--bg-chat); }
.sos-tabs { display: flex; background: var(--bg-modal); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.sos-tab { flex: 1; padding: 14px 8px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: var(--text-secondary); cursor: pointer; position: relative; }
.sos-tab.active { color: var(--accent); }
.sos-tab.active::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }
.sos-content { padding: 14px 12px 40px; max-width: 520px; margin: 0 auto; width: 100%; box-sizing: border-box; }
.sos-badge { display: inline-block; background: #ff3b30; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 800; margin-left: 6px; }
</style>
</head>
<body>
<div class="sos-page">
  <header class="page-header">
    <a href="/" class="header-btn">Home</a>
    <h1>💬 Sosial Anonim</h1>
  </header>

  <div id="sosMain"></div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="common.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="auth-socket.js"></script>
<script src="sosial.js"></script>
</body>
</html>
