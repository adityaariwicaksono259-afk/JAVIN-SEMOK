<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NGL Sender - JAVACHAT</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-y: auto; height: auto; min-height: 100vh; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f0efe8;
  color: #1a1a1a;
}
.ngl-page {
  min-height: 100vh;
  padding-bottom: 100px;
}
.ngl-header {
  background: #1f6f5c;
  color: white;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.ngl-header a {
  color: white;
  text-decoration: none;
  background: rgba(255,255,255,0.15);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
}
.ngl-header h1 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
}
.ngl-wrap {
  max-width: 620px;
  margin: 0 auto;
  padding: 20px 16px 120px;
}
.ngl-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.ngl-card h2 {
  margin: 0 0 6px;
  font-size: 1.5rem;
  color: #0f2a24;
}
.ngl-sub {
  font-size: 0.88rem;
  color: #5a5a5a;
  margin: 0 0 20px;
}
.ngl-label {
  display: block;
  margin: 16px 0 8px;
  font-weight: 700;
  font-size: 0.95rem;
  color: #0f2a24;
}
.ngl-label .req { color: #e63946; margin-left: 2px; }
.ngl-input, .ngl-textarea {
  width: 100%;
  border: 1.5px solid #d8d5cc;
  border-radius: 12px;
  padding: 12px 14px;
  font: inherit;
  font-size: 1rem;
  background: #f7f6f1;
  color: #1a1a1a;
  transition: border-color 0.15s;
}
.ngl-input:focus, .ngl-textarea:focus {
  outline: none;
  border-color: #1f6f5c;
  background: #ffffff;
}
.ngl-textarea {
  min-height: 110px;
  resize: vertical;
  font-family: inherit;
}
.ngl-counter {
  text-align: right;
  font-size: 0.78rem;
  color: #8a8a8a;
  margin-top: 6px;
}
.ngl-counter.warn { color: #e09b20; }
.ngl-counter.over { color: #e63946; font-weight: 700; }
.ngl-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.ngl-btn {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.15s;
}
.ngl-btn:active { transform: scale(0.97); }
.ngl-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.ngl-btn-primary {
  flex: 1;
  background: linear-gradient(135deg, #7c5cff, #9d7cff);
  color: white;
}
.ngl-btn-secondary {
  flex: 0 0 auto;
  padding: 14px 18px;
  background: #e8e6df;
  color: #4a4a4a;
  border: 1.5px solid #d8d5cc;
}
.ngl-result-section { margin-top: 24px; }

.ngl-status-box {
  display: none;
  padding: 16px 18px;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.5;
  text-align: center;
}
.ngl-status-box.show { display: block; }
.ngl-status-box.success {
  background: #d4f5e8;
  border: 1.5px solid #00b894;
  color: #0a5c47;
}
.ngl-status-box.error {
  background: #fde8ea;
  border: 1.5px solid #e63946;
  color: #a01824;
}
.ngl-status-box.info {
  background: #f0eee5;
  border: 1.5px solid #d8d5cc;
  color: #5a5a5a;
}
.ngl-status-icon {
  font-size: 1.5rem;
  display: block;
  margin-bottom: 4px;
}
.ngl-status-title {
  display: block;
  font-weight: 700;
  margin-bottom: 2px;
}
.ngl-status-sub {
  display: block;
  font-weight: 400;
  font-size: 0.82rem;
  opacity: 0.75;
  margin-top: 4px;
}

.ngl-loading {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 0;
  color: #5a5a5a;
  font-size: 0.88rem;
}
.ngl-loading.show { display: flex; }
.ngl-spinner {
  width: 16px;
  height: 16px;
  border: 2.5px solid #d8d5cc;
  border-top-color: #7c5cff;
  border-radius: 50%;
  animation: ngl-spin 0.7s linear infinite;
}
@keyframes ngl-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="ngl-page">
  <header class="ngl-header">
    <a href="/tools.html">← Tools</a>
    <h1>📨 NGL Sender</h1>
  </header>

  <div class="ngl-wrap">
    <div class="ngl-card">
      <h2>NGL Sender</h2>
      <p class="ngl-sub">kirim pesan secara bertubi-tubi</p>

      <div class="ngl-coin-bar" id="nglCoinBar">
        <span>💰 Saldo: <strong id="nglSaldo">—</strong> coin</span>
        <span>Biaya: <strong id="nglBiaya">3</strong> coin</span>
      </div>

      <label class="ngl-label" for="nglTarget">
        Masukan Link/User NGL <span class="req">*</span>
      </label>
      <input id="nglTarget" class="ngl-input" type="text" placeholder="Ketik username atau link NGL" autocomplete="off" />

      <label class="ngl-label" for="nglPesan">
        Isi Pesan yang Ingin Dikirim <span class="req">*</span>
      </label>
      <textarea id="nglPesan" class="ngl-textarea" placeholder="masukan teks" maxlength="500"></textarea>
      <div class="ngl-counter" id="nglCounter">0 / 500</div>

      <label class="ngl-label" for="nglJumlah">
        Jumlah Kirim <span class="req">*</span>
      </label>
      <input id="nglJumlah" class="ngl-input" type="number" value="1" min="1" max="1000" step="1" />

      <div class="ngl-actions">
        <button id="nglSend" class="ngl-btn ngl-btn-primary" type="button">🚀 KIRIM</button>
        <button id="nglClear" class="ngl-btn ngl-btn-secondary" type="button">🗑️</button>
      </div>

      <div class="ngl-result-section">
        <div id="nglLoading" class="ngl-loading">
          <div class="ngl-spinner"></div>
          <span>Mengirim pesan...</span>
        </div>
        <div id="nglStatusBox" class="ngl-status-box"></div>
      </div>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="nglLoginOverlay" class="ngl-login-overlay">
  <div class="ngl-login-box">
    <h3>🔐 Login</h3>
    <p>Masuk pakai Gmail untuk pakai NGL Sender</p>
    <input id="nglLoginEmail" type="email" placeholder="email@gmail.com" autocomplete="email" />
    <button id="nglLoginBtn" type="button">Masuk</button>
    <div id="nglLoginError" class="ngl-login-error"></div>
  </div>
</div>

<script>
/* === KONFIGURASI === */
const NGL_PROXY_URL = '/api/ngl';
const NGL_TIMEOUT_MS = 120000;

/* === DOM === */
const $ = (id) => document.getElementById(id);
const targetIn = $('nglTarget');
const pesanIn = $('nglPesan');
const jumlahIn = $('nglJumlah');
const counterEl = $('nglCounter');
const sendBtn = $('nglSend');
const clearBtn = $('nglClear');
const loadingEl = $('nglLoading');
const statusBox = $('nglStatusBox');
const loginOverlay = $('nglLoginOverlay');
const loginEmail = $('nglLoginEmail');
const loginBtn = $('nglLoginBtn');
const loginError = $('nglLoginError');
const coinBar = $('nglCoinBar');
let saldoEl = $('nglSaldo');
let biayaEl = $('nglBiaya');

/* === COIN === */
const NGL_COIN_PER_PESAN = 3;
let nglSaldo = 0;

function getToken() {
  try { return localStorage.getItem('javachat_token') || ''; }
  catch (e) { return ''; }
}

function getUserName() {
  try { return localStorage.getItem('javachat_username') || ''; }
  catch (e) { return ''; }
}

function getEmail() {
  try { return localStorage.getItem('javachat_email') || ''; }
  catch (e) { return ''; }
}

function saveAuth(d) {
  try {
    localStorage.setItem('javachat_id', d.userId);
    localStorage.setItem('javachat_token', d.token);
    localStorage.setItem('javachat_username', d.username);
    localStorage.setItem('javachat_email', d.email);
  } catch (e) {}
}

function logout() {
  try {
    localStorage.removeItem('javachat_id');
    localStorage.removeItem('javachat_token');
    localStorage.removeItem('javachat_username');
    localStorage.removeItem('javachat_email');
  } catch (e) {}
  location.reload();
}

function showLogin() {
  loginOverlay.classList.add('show');
  setTimeout(function() { loginEmail.focus(); }, 100);
}

function hideLogin() {
  loginOverlay.classList.remove('show');
  loginError.textContent = '';
}

async function loginWithGmail() {
  var email = loginEmail.value.trim().toLowerCase();
  loginError.textContent = '';

  if (!email) {
    loginError.textContent = 'Email wajib diisi';
    return;
  }
  if (email.indexOf('@gmail.com') === -1 && email.indexOf('@googlemail.com') === -1) {
    loginError.textContent = 'Harus pakai email Gmail';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'Memproses...';

  try {
    var r = await fetch('/api/auth/gmail', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    var d = await r.json();

    if (!r.ok || !d.status) {
      loginError.textContent = d.message || 'Login gagal';
      return;
    }

    saveAuth(d);
    hideLogin();
    await loadBalance();
  } catch (e) {
    loginError.textContent = 'Error: ' + e.message;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Masuk';
  }
}

async function loadBalance() {
  var token = getToken();
  if (!token) {
    showLogin();
    return;
  }
  try {
    var r = await fetch('/api/ngl/balance', {
      headers: { 'x-auth-token': token }
    });
    if (r.status === 401) {
      logout();
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    nglSaldo = d.coins || 0;
    renderCoinBar();
    updateBiaya();
  } catch (e) {
    console.error('Load balance error:', e.message);
  }
}

function renderCoinBar() {
  var username = getUserName() || getEmail() || 'User';
  coinBar.classList.remove('low');
  coinBar.style.display = 'block';
  coinBar.innerHTML =
    '<div class="ngl-user-bar">' +
      '<span>👤 ' + username + '</span>' +
      '<button type="button" id="nglLogoutBtn">Keluar</button>' +
    '</div>' +
    '<div style="display:flex;justify-content:space-between;padding:8px 4px;">' +
      '<span>💰 Saldo: <strong id="nglSaldo">' + nglSaldo.toLocaleString('id-ID') + '</strong> coin</span>' +
      '<span>Biaya: <strong id="nglBiaya">' + ((parseInt(jumlahIn.value) || 1) * NGL_COIN_PER_PESAN) + '</strong> coin</span>' +
    '</div>';

  saldoEl = document.getElementById('nglSaldo');
  biayaEl = document.getElementById('nglBiaya');

  var lb = document.getElementById('nglLogoutBtn');
  if (lb) lb.addEventListener('click', logout);
}

function updateBiaya() {
  if (!biayaEl) return;
  var jumlah = parseInt(jumlahIn.value, 10) || 0;
  var biaya = jumlah * NGL_COIN_PER_PESAN;
  biayaEl.textContent = biaya.toLocaleString('id-ID');
  var kurang = biaya > nglSaldo;
  coinBar.classList.toggle('low', kurang);
}

let nglRequesting = false;

/* === HELPERS === */
function showLoading(s) {
  loadingEl.classList.toggle('show', s);
  sendBtn.disabled = s;
  sendBtn.textContent = s ? '⏳ MENGIRIM...' : '🚀 KIRIM';
}
function normalizeTarget(r) {
  let s = (r || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  s = s.replace(/^@/, '');
  return 'https://ngl.link/' + s;
}
function isValidURL(s) {
  try {
    const u = new URL(s);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch (e) { return false; }
}
function updateCounter() {
  const l = pesanIn.value.length;
  counterEl.textContent = l + ' / 500';
  counterEl.className = 'ngl-counter';
  if (l > 450) counterEl.classList.add('warn');
  if (l >= 500) counterEl.classList.add('over');
}
function buildURL() {
  const u = new URL(NGL_PROXY_URL, window.location.origin);
  const token = getToken();
  if (token) u.searchParams.set('token', token);
  u.searchParams.set('url', normalizeTarget(targetIn.value));
  u.searchParams.set('pesan', pesanIn.value.trim());
  u.searchParams.set('jumlah', jumlahIn.value.trim());
  return u.toString();
}
async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || NGL_TIMEOUT_MS);
  try { return await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(timer); }
}

/* === STATUS HELPERS === */
function showStatus(type, title, sub) {
  statusBox.className = 'ngl-status-box show ' + type;
  statusBox.innerHTML = '';

  const icon = document.createElement('span');
  icon.className = 'ngl-status-icon';
  icon.textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
  statusBox.appendChild(icon);

  const t = document.createElement('span');
  t.className = 'ngl-status-title';
  t.textContent = title;
  statusBox.appendChild(t);

  if (sub) {
    const s = document.createElement('span');
    s.className = 'ngl-status-sub';
    s.textContent = sub;
    statusBox.appendChild(s);
  }
}

function hideStatus() {
  statusBox.className = 'ngl-status-box';
  statusBox.innerHTML = '';
}

/* === SEND === */
async function sendRequest() {
  if (nglRequesting) return;

  const raw = targetIn.value.trim();
  const pesan = pesanIn.value.trim();
  const jumlah = parseInt(jumlahIn.value, 10);

  if (!raw) {
    showStatus('error', 'Gagal Mengirim Pesan', 'Username / link NGL masih kosong');
    targetIn.focus();
    return;
  }
  const targetURL = normalizeTarget(raw);
  if (!isValidURL(targetURL)) {
    showStatus('error', 'Gagal Mengirim Pesan', 'Link NGL tidak valid');
    targetIn.focus();
    return;
  }
  if (!pesan) {
    showStatus('error', 'Gagal Mengirim Pesan', 'Pesan masih kosong');
    pesanIn.focus();
    return;
  }
  if (!jumlah || jumlah < 1) {
    showStatus('error', 'Gagal Mengirim Pesan', 'Jumlah minimal 1');
    jumlahIn.focus();
    return;
  }
  if (jumlah > 1000) {
    showStatus('error', 'Gagal Mengirim Pesan', 'Jumlah maksimal 1000');
    jumlahIn.focus();
    return;
  }

  nglRequesting = true;
  hideStatus();
  showLoading(true);

  const apiURL = buildURL();
  const start = performance.now();

  try {
    const res = await fetchWithTimeout(apiURL);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { data = { raw: text.slice(0, 500) }; }

    if (!res.ok) {
      showStatus('error', 'Gagal Mengirim Pesan', 'Server balikin HTTP ' + res.status);
    } else if (data && data.status === false) {
      showStatus('error', 'Gagal Mengirim Pesan', data.message || data.msg || 'API menolak permintaan');
    } else {
      // Update saldo dari response
      if (data.sisa_coin !== undefined) {
        nglSaldo = data.sisa_coin;
        saldoEl.textContent = nglSaldo.toLocaleString('id-ID');
        updateBiaya();
      }
      const biaya = data.coin_terpakai || (jumlah * NGL_COIN_PER_PESAN);
      showStatus('success', 'Berhasil Mengirim Pesan - Javin',
        jumlah + ' pesan terkirim ke @' + targetURL.replace('https://ngl.link/', '').replace('@', '') +
        ' • ' + biaya + ' coin terpakai');
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      showStatus('error', 'Gagal Mengirim Pesan', 'Timeout — server tidak merespons');
    } else {
      showStatus('error', 'Gagal Mengirim Pesan', err.message);
    }
  } finally {
    nglRequesting = false;
    showLoading(false);
  }
}

/* === CLEAR === */
function clearAll() {
  targetIn.value = '';
  pesanIn.value = '';
  jumlahIn.value = '1';
  hideStatus();
  updateCounter();
  updateBiaya();
  targetIn.focus();
}

/* === EVENTS === */
sendBtn.addEventListener('click', sendRequest);
clearBtn.addEventListener('click', clearAll);
pesanIn.addEventListener('input', updateCounter);
jumlahIn.addEventListener('input', updateBiaya);
targetIn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); pesanIn.focus(); }
});
pesanIn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendRequest();
  }
});

loginBtn.addEventListener('click', loginWithGmail);
loginEmail.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); loginWithGmail(); }
});

updateCounter();
loadBalance();
targetIn.focus();
</script>
</body>
</html>
