<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tebak Angka - JavaChat</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="/theme-accent.css?v=1">
</head>
<body>
<div class="page tebak-page">
  <header class="page-header">
    <a href="/" class="header-btn">Home</a>
    <h1>Tebak Angka</h1>
  </header>
  <div class="page-content tebak-content">
    <div class="tebak-balance">
      <span class="tb-label">SALDO</span>
      <span class="tb-value" id="tebakBalance">0</span>
    </div>

    <div class="tebak-stage">
      <div class="tebak-circle" id="tebakCircle">?</div>
    </div>

    <div class="tebak-result" id="tebakResult">Pilih angka 1-10 lalu tebak!</div>

    <div class="tebak-bet-row">
      <button class="tebak-chip" data-bet="10">10</button>
      <button class="tebak-chip active" data-bet="50">50</button>
      <button class="tebak-chip" data-bet="100">100</button>
      <button class="tebak-chip" data-bet="500">500</button>
      <button class="tebak-chip tebak-chip-max" data-bet="max">MAX</button>
    </div>

    <div class="tebak-num-grid" id="tebakNumGrid"></div>
    <div class="tebak-hint">Menang x5 dari bet lo</div>

    <button class="tebak-play-btn" id="tebakPlay">TEBAK SEKARANG</button>

    <div class="tebak-history-title">Riwayat</div>
    <div class="tebak-history" id="tebakHistory"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="common.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="auth-socket.js"></script>
<script src="tebak.js"></script>
</body>
</html>
