<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Remove Background - JAVIN SEMOK</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page rbg-page">
  <header class="page-header">
    <a href="/tools.html" class="header-btn">←</a>
    <h1>🖼️ Remove Background</h1>
  </header>
  <div class="page-content rbg-content">

    <div class="rbg-info">Upload gambar, background otomatis hilang. Hasil PNG transparan.</div>

    <div class="rbg-upload" id="rbgUpload">
      <div class="rbg-upload-icon">📤</div>
      <div class="rbg-upload-title">Tap buat pilih gambar</div>
      <div class="rbg-upload-sub">JPG / PNG / WEBP • Max 10MB</div>
    </div>
    <input type="file" id="rbgFile" accept="image/*" hidden />

    <div class="rbg-loading hidden" id="rbgLoading">
      <div class="rbg-spinner"></div>
      <div class="rbg-loading-text" id="rbgLoadingText">Memuat AI model... (pertama kali ~20MB)</div>
      <div class="rbg-progress"><div class="rbg-progress-bar" id="rbgProgress"></div></div>
    </div>

    <div class="rbg-result hidden" id="rbgResult">
      <div class="rbg-preview-wrap">
        <div class="rbg-preview-checker">
          <img id="rbgPreview" alt="Hasil" />
        </div>
        <div class="rbg-hint">Background transparan (kotak-kotak)</div>
      </div>
      <div class="rbg-actions">
        <button class="rbg-btn rbg-btn-preview" id="rbgPreviewBtn">👁️ Preview Full</button>
        <button class="rbg-btn rbg-btn-download" id="rbgDownloadBtn">⬇️ Download PNG</button>
        <button class="rbg-btn rbg-btn-reset" id="rbgResetBtn">🔄 Ganti Gambar</button>
      </div>
    </div>

    <div class="rbg-error hidden" id="rbgError"></div>

  </div>
</div>

<div id="rbgViewer" class="rbg-viewer hidden">
  <img id="rbgViewerImg" alt="" />
  <button id="rbgViewerClose" class="rbg-viewer-close">✕</button>
</div>

<div id="toast" class="toast hidden"></div>
<script src="common.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="auth-socket.js"></script>
<script type="module" src="removebg.js"></script>
</body>
</html>
