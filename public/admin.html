<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Admin Panel - JavaChat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <header class="page-header">
    <a href="/chat.html" class="header-btn">← Kembali</a>
    <h1>🛠️ Admin Panel</h1>
  </header>
  <div class="page-content">
    <div id="adminLoginBox">
      <h2>Login Admin</h2>
      <input id="adminPass" type="password" placeholder="Password admin" />
      <div id="adminLoginErr" class="err"></div>
      <button id="adminLoginConfirm" class="btn-primary big-btn">Login</button>
    </div>
    <div id="adminPanelBox" class="hidden"><a href="/dashboard.html" class="btn-primary big-btn" style="display:block;text-align:center;margin-bottom:14px;text-decoration:none">📊 Buka Dashboard</a><div class="kas-admin-box"><label>💰 COIN KAS EVENT</label><div class="kas-display"><span class="kas-label">Saldo Kas:</span><span class="kas-val" id="kasVal">0</span></div><div class="kas-form"><input id="kasUser" type="text" placeholder="Cari username..." autocomplete="off" /><div id="kasResults" class="kas-results"></div><div id="kasSelected" class="kas-selected"></div><input id="kasAmount" type="number" placeholder="Jumlah coin" min="1" /><button id="kasSend" class="btn-primary">KIRIM DARI KAS</button></div><div id="kasMsg" class="add-admin-msg"></div></div><div class="mt-admin-box"><label>MAINTENANCE MODE</label><div class="mt-row"><span id="mtStatus">OFF</span><button id="mtToggle" class="mt-switch">AKTIFKAN</button></div><input id="mtInput" type="text" placeholder="Pesan untuk user..." maxlength="300" /><div id="mtMsg" class="add-admin-msg"></div></div><div class="add-admin-box"><label>ADD ADMIN CHAT</label><input id="addAdminInput" type="text" placeholder="Username user..." autocomplete="off" /><button id="addAdminBtn" class="btn-primary">+ Jadikan Admin</button><div id="addAdminMsg" class="add-admin-msg"></div></div>
      <div class="tabs">
        <button class="tab active" data-atab="users">Users</button>
        <button class="tab" data-atab="topups">Top-up</button>
      </div>
      <div id="adminUsersTab" class="admin-list"></div>
      <div id="adminTopupsTab" class="admin-list hidden"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="common.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="auth-socket.js"></script>
<script src="admin.js"></script>
</body>
</html>
