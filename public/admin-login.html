<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login - JAVIN SEMOK</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:#0a0a0f; color:#e8e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.box { background:#12121a; border:1px solid #2a2a3a; border-radius:16px; padding:32px 24px; max-width:400px; width:100%; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
.icon { font-size:3rem; text-align:center; margin-bottom:12px; }
h1 { font-size:1.4rem; margin-bottom:6px; text-align:center; color:#00d4aa; }
p { color:#8888a0; font-size:0.85rem; text-align:center; margin-bottom:24px; }
label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:#8888a0; margin-bottom:6px; }
input { width:100%; background:#1a1a26; border:1.5px solid #2a2a3a; border-radius:10px; padding:13px 14px; color:#e8e8f0; font-size:1rem; font-family:inherit; }
input:focus { outline:none; border-color:#7c5cff; }
button { width:100%; margin-top:16px; padding:13px; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; background:linear-gradient(135deg, #7c5cff, #9d7cff); color:white; font-family:inherit; }
button:disabled { opacity:0.6; cursor:not-allowed; }
.status { margin-top:14px; padding:12px; border-radius:10px; font-size:0.85rem; display:none; text-align:center; }
.status.show { display:block; }
.status.ok { background:#d4f5e8; border:1.5px solid #00b894; color:#0a5c47; }
.status.err { background:#fde8ea; border:1.5px solid #e63946; color:#a01824; }
.admin-panel { display:none; margin-top:20px; }
.admin-panel.show { display:block; }
.admin-panel h2 { font-size:1.1rem; margin-bottom:12px; color:#00d4aa; text-align:center; }
.admin-btn { display:block; width:100%; margin-top:8px; padding:11px; border-radius:8px; font-size:0.88rem; font-weight:600; cursor:pointer; text-decoration:none; text-align:center; background:#1a1a26; color:#e8e8f0; border:1px solid #2a2a3a; }
.admin-btn:hover { background:#25252f; border-color:#7c5cff; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔐</div>
  <h1>Admin Login</h1>
  <p>Masukkan password admin untuk lanjut</p>

  <div id="loginForm">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" />
    <button id="loginBtn">Login</button>
    <div class="status" id="statusBox"></div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <h2>✅ Selamat datang, Admin</h2>
    <a href="/api/admin/dashboard" target="_blank" class="admin-btn">📊 Dashboard</a>
    <a href="/api/admin/security" target="_blank" class="admin-btn">🛡️ Security (Blacklist)</a>
    <a href="/api/admin/logs?limit=100" target="_blank" class="admin-btn">📜 Logs</a>
    <a href="/api/admin/reputation" target="_blank" class="admin-btn">⭐ Reputation</a>
    <a href="/api/admin/unban?ip=all" target="_blank" class="admin-btn">🔓 Unban Semua</a>
    <button class="admin-btn" id="logoutBtn" style="margin-top:12px;color:#ff4d6d;">🚪 Logout</button>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };

async function checkLogin() {
  try {
    var r = await fetch('/api/admin/check');
    var d = await r.json();
    if (d.isAdmin) showAdminPanel();
  } catch(e) {}
}

function showAdminPanel() {
  $('loginForm').style.display = 'none';
  $('adminPanel').classList.add('show');
}

function showStatus(type, msg) {
  var s = $('statusBox');
  s.className = 'status show ' + type;
  s.textContent = msg;
}

$('loginBtn').onclick = async function() {
  var pw = $('pw').value;
  if (!pw) { showStatus('err', 'Password wajib diisi'); return; }
  var btn = $('loginBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Memproses...';
  $('statusBox').classList.remove('show');

  try {
    var r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    var d = await r.json();
    if (d.status) {
      showStatus('ok', 'Login berhasil!');
      $('pw').value = '';
      setTimeout(showAdminPanel, 500);
    } else {
      showStatus('err', d.message || 'Login gagal');
    }
  } catch(e) {
    showStatus('err', 'Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
};

$('logoutBtn').onclick = async function() {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
};

$('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') $('loginBtn').click();
});

checkLogin();
</script>
</body>
</html>
