<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wink - Image Upscaler</title>
<link rel="stylesheet" href="/style.css">
<style>
/* === FIX SCROLL & LAYOUT === */
html, body {
  overflow-y: auto !important;
  height: auto !important;
  min-height: 100vh !important;
}
.page {
  display: block !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  padding-bottom: 80px !important;
}
.page-header {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  flex-direction: row !important;
}

.wk-wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 100px;
  display: block;
}
.wk-card {
  background: rgba(20,25,40,0.72);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 18px;
  padding: 26px 22px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  display: block;
}
.wk-card h2 {
  margin: 0 0 8px;
  font-size: 1.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff, #00ffaa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: block;
}
.wk-sub {
  color: rgba(255,255,255,0.6);
  font-size: 0.86rem;
  margin: 0 0 22px;
  line-height: 1.5;
  display: block;
}
.wk-label {
  display: block;
  margin: 18px 0 8px;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
}
.wk-input,
.wk-textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 13px 14px;
  font: inherit;
  font-size: 0.95rem;
  background: rgba(0,0,0,0.35);
  color: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
  display: block;
}
.wk-input:focus,
.wk-textarea:focus {
  outline: none;
  border-color: #7c5cff;
  box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
}
.wk-input::placeholder,
.wk-textarea::placeholder {
  color: rgba(255,255,255,0.35);
}
.wk-textarea {
  min-height: 110px;
  resize: vertical;
  font-family: inherit;
}
.wk-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 4px;
}
@media (max-width: 480px) {
  .wk-row { grid-template-columns: 1fr; }
}
.wk-btn {
  width: 100%;
  margin-top: 22px;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  font: inherit;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  background: linear-gradient(135deg, #7c5cff, #9d7cff);
  color: #fff;
  transition: transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(124,92,255,0.35);
  display: block;
}
.wk-btn:active { transform: scale(0.97); }
.wk-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.wk-btn:hover:not(:disabled) {
  box-shadow: 0 10px 28px rgba(124,92,255,0.5);
  transform: translateY(-2px);
}
.wk-result {
  margin-top: 22px;
  padding: 16px 18px;
  border-radius: 14px;
  text-align: center;
  font-weight: 700;
  font-size: 0.92rem;
  display: none;
  line-height: 1.5;
}
.wk-result.show { display: block; }
.wk-result.ok {
  background: rgba(0,212,170,0.12);
  border: 1.5px solid #00d4aa;
  color: #00ffcc;
}
.wk-result.err {
  background: rgba(255,77,109,0.12);
  border: 1.5px solid #ff4d6d;
  color: #ff8fa3;
}
.wk-img,
.wk-video {
  margin-top: 18px;
  width: 100%;
  max-width: 100%;
  border-radius: 14px;
  display: none;
  border: 1px solid rgba(255,255,255,0.1);
}
.wk-img.show,
.wk-video.show { display: block; }
.wk-dl {
  display: none;
  margin-top: 14px;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, #00d4aa, #00b894);
  color: #001a16;
  font-weight: 800;
  text-decoration: none;
  text-align: center;
  font-size: 0.95rem;
  letter-spacing: 0.3px;
  box-shadow: 0 6px 20px rgba(0,212,170,0.3);
}
.wk-dl.show { display: block; }
.wk-loading {
  text-align: center;
  padding: 22px 0;
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem;
  display: none;
}
.wk-loading.show { display: block; }
.wk-spinner {
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: #7c5cff;
  border-radius: 50%;
  animation: wk-spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes wk-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="page">
<header class="page-header">
<a href="/tools.html" class="header-btn">← Tools</a>
<h1>✨ Wink Upscaler</h1>
</header>
<div class="wk-wrap">
<div class="wk-card">
<h2>✨ Wink Upscaler</h2>
<p class="wk-sub">Perjelas gambar jadi HD berkualitas tinggi dengan AI</p>
<label class="wk-label">URL Gambar</label>
<input id="wkUrl" class="wk-input" type="url" placeholder="https://example.com/image.jpg" autocomplete="off">
<button id="wkBtn" class="wk-btn">🚀 Proses Sekarang</button>
<div id="wkLoading" class="wk-loading"><div class="wk-spinner"></div>Memproses gambar...</div>
<div id="wkResult" class="wk-result"></div>
<img id="wkImg" class="wk-img" alt="Result">
</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var btn=$('wkBtn'),input=$('wkUrl'),result=$('wkResult'),loading=$('wkLoading'),img=$('wkImg');
function showStatus(type,msg){result.className='wk-result show '+type;result.textContent=msg}
function hide(){result.className='wk-result';loading.className='wk-loading';img.className='wk-img'}
btn.onclick=async function(){
var url=input.value.trim();
if(!url){showStatus('err','❌ URL gambar tidak boleh kosong');return}
hide();loading.className='wk-loading show';btn.disabled=true;btn.textContent='⏳ Memproses...';
try{
var r=await fetch('/api/wink-proxy?url='+encodeURIComponent(url));
if(!r.ok)throw new Error('Gagal memproses gambar');
var blob=await r.blob();
var objUrl=URL.createObjectURL(blob);
img.src=objUrl;img.className='wk-img show';
showStatus('ok','✅ Berhasil! Gambar berhasil ditingkatkan');
}catch(e){
showStatus('err','❌ Gagal: '+e.message);
}finally{
btn.disabled=false;btn.textContent='🚀 Proses Sekarang';
loading.className='wk-loading';
}
};
})();
</script>
<script src="/theme-accent.js"></script>
</body>
</html>
