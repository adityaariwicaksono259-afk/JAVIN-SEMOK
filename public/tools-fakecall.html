<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Call</title>
<link rel="stylesheet" href="/style.css">
<style>
/* === FIX SCROLL & LAYOUT === */
html, body {
  overflow-y: auto !important;
  height: auto !important;
  min-height: 100vh !important;
}
.page {
  display: block !important;
  height: auto !important;
  min-height: 100vh !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  padding-bottom: 80px !important;
}
.page-header {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  flex-direction: row !important;
}

.fc-wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 100px;
  display: block;
}
.fc-card {
  background: rgba(20,25,40,0.72);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 18px;
  padding: 26px 22px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  display: block;
}
.fc-card h2 {
  margin: 0 0 8px;
  font-size: 1.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff, #00ffaa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: block;
}
.fc-sub {
  color: rgba(255,255,255,0.6);
  font-size: 0.86rem;
  margin: 0 0 22px;
  line-height: 1.5;
  display: block;
}
.fc-label {
  display: block;
  margin: 18px 0 8px;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
}
.fc-input,
.fc-textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 13px 14px;
  font: inherit;
  font-size: 0.95rem;
  background: rgba(0,0,0,0.35);
  color: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
  display: block;
}
.fc-input:focus,
.fc-textarea:focus {
  outline: none;
  border-color: #7c5cff;
  box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
}
.fc-input::placeholder,
.fc-textarea::placeholder {
  color: rgba(255,255,255,0.35);
}
.fc-textarea {
  min-height: 110px;
  resize: vertical;
  font-family: inherit;
}
.fc-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 4px;
}
@media (max-width: 480px) {
  .fc-row { grid-template-columns: 1fr; }
}
.fc-btn {
  width: 100%;
  margin-top: 22px;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  font: inherit;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  background: linear-gradient(135deg, #7c5cff, #9d7cff);
  color: #fff;
  transition: transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(124,92,255,0.35);
  display: block;
}
.fc-btn:active { transform: scale(0.97); }
.fc-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.fc-btn:hover:not(:disabled) {
  box-shadow: 0 10px 28px rgba(124,92,255,0.5);
  transform: translateY(-2px);
}
.fc-result {
  margin-top: 22px;
  padding: 16px 18px;
  border-radius: 14px;
  text-align: center;
  font-weight: 700;
  font-size: 0.92rem;
  display: none;
  line-height: 1.5;
}
.fc-result.show { display: block; }
.fc-result.ok {
  background: rgba(0,212,170,0.12);
  border: 1.5px solid #00d4aa;
  color: #00ffcc;
}
.fc-result.err {
  background: rgba(255,77,109,0.12);
  border: 1.5px solid #ff4d6d;
  color: #ff8fa3;
}
.fc-img,
.fc-video {
  margin-top: 18px;
  width: 100%;
  max-width: 100%;
  border-radius: 14px;
  display: none;
  border: 1px solid rgba(255,255,255,0.1);
}
.fc-img.show,
.fc-video.show { display: block; }
.fc-dl {
  display: none;
  margin-top: 14px;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, #00d4aa, #00b894);
  color: #001a16;
  font-weight: 800;
  text-decoration: none;
  text-align: center;
  font-size: 0.95rem;
  letter-spacing: 0.3px;
  box-shadow: 0 6px 20px rgba(0,212,170,0.3);
}
.fc-dl.show { display: block; }
.fc-loading {
  text-align: center;
  padding: 22px 0;
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem;
  display: none;
}
.fc-loading.show { display: block; }
.fc-spinner {
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: #7c5cff;
  border-radius: 50%;
  animation: fc-spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes fc-spin { to { transform: rotate(360deg); } }
.fc-dl{display:none;margin-top:14px;padding:13px;border-radius:12px;background:linear-gradient(135deg,#00d4aa,#00b894);color:#001a16;font-weight:800;text-decoration:none;text-align:center;font-size:0.95rem;box-shadow:0 6px 20px rgba(0,212,170,0.3)}
.fc-dl.show{display:block}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
<a href="/tools.html" class="header-btn">← Tools</a>
<h1>📞 Fake Call</h1>
</header>
<div class="fc-wrap">
<div class="fc-card">
<h2>📞 Fake Call Generator</h2>
<p class="fc-sub">Buat screenshot panggilan palsu yang terlihat nyata</p>
<label class="fc-label">URL Foto Profil</label>
<input id="fcPp" class="fc-input" type="url" placeholder="https://example.com/pp.jpg" autocomplete="off">
<label class="fc-label">Nama Penelepon</label>
<input id="fcName" class="fc-input" type="text" placeholder="Nama orang" autocomplete="off">
<label class="fc-label">Durasi (detik)</label>
<input id="fcDur" class="fc-input" type="number" value="19" min="1" max="999">
<button id="fcBtn" class="fc-btn">🚀 Buat Fake Call</button>
<div id="fcLoading" class="fc-loading"><div class="fc-spinner"></div>Memproses...</div>
<div id="fcResult" class="fc-result"></div>
<img id="fcImg" class="fc-img" alt="Fake Call Result">
<a id="fcDl" class="fc-dl" download="fakecall.jpg">⬇️ Download Gambar</a>
</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var btn=$('fcBtn'),pp=$('fcPp'),name=$('fcName'),dur=$('fcDur'),result=$('fcResult'),loading=$('fcLoading'),img=$('fcImg');
function showStatus(type,msg){result.className='fc-result show '+type;result.textContent=msg}
function hide(){result.className='fc-result';loading.className='fc-loading';img.className='fc-img';var d=document.getElementById('fcDl');if(d)d.className='fc-dl'}
btn.onclick=async function(){
var ppurl=pp.value.trim(),nm=name.value.trim()||'Unknown',d=dur.value||'19';
if(!ppurl){showStatus('err','❌ URL foto profil tidak boleh kosong');return}
hide();loading.className='fc-loading show';btn.disabled=true;btn.textContent='⏳ Memproses...';
try{
var r=await fetch('/api/fakecall-proxy?ppurl='+encodeURIComponent(ppurl)+'&name='+encodeURIComponent(nm)+'&duration='+encodeURIComponent(d));
if(!r.ok)throw new Error('Gagal membuat fake call');
var blob=await r.blob();
var objUrl=URL.createObjectURL(blob);
img.src=objUrl;img.className='fc-img show';var dl=document.getElementById('fcDl');dl.href=objUrl;dl.className='fc-dl show';
showStatus('ok','✅ Berhasil! Fake call berhasil dibuat');
}catch(e){
showStatus('err','❌ Gagal: '+e.message);
}finally{
btn.disabled=false;btn.textContent='🚀 Buat Fake Call';
loading.className='fc-loading';
}
};
})();
</script>
</body>
</html>
