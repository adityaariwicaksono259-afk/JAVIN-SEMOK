<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Call</title>
<link rel="stylesheet" href="/style.css">
<style>
.fc-wrap{max-width:620px;margin:0 auto;padding:20px}
.fc-card{background:rgba(20,25,40,0.65);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px}
.fc-card h2{margin:0 0 6px;color:#fff}
.fc-sub{color:rgba(255,255,255,0.6);font-size:0.85rem;margin-bottom:20px}
.fc-label{display:block;margin:16px 0 6px;font-weight:600;color:#fff}
.fc-input{width:100%;box-sizing:border-box;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px;font:inherit;background:rgba(0,0,0,0.3);color:#fff}
.fc-input:focus{outline:none;border-color:#7c5cff}
.fc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fc-btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#9d7cff);color:#fff}
.fc-btn:disabled{opacity:0.6;cursor:not-allowed}
.fc-result{margin-top:20px;padding:16px;border-radius:12px;text-align:center;display:none}
.fc-result.show{display:block}
.fc-result.ok{background:rgba(0,212,170,0.12);border:1.5px solid #00d4aa;color:#00d4aa}
.fc-result.err{background:rgba(255,77,109,0.12);border:1.5px solid #ff4d6d;color:#ff8fa3}
.fc-img{margin-top:16px;max-width:100%;border-radius:12px;display:none}
.fc-img.show{display:block}
.fc-loading{text-align:center;padding:20px;color:rgba(255,255,255,0.6);display:none}
.fc-loading.show{display:block}
.fc-spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,0.15);border-top-color:#7c5cff;border-radius:50%;animation:fc-spin 0.8s linear infinite;margin:0 auto 10px}
@keyframes fc-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
<a href="/tools.html" class="header-btn">← Tools</a>
<h1>📞 Fake Call</h1>
</header>
<div class="fc-wrap">
<div class="fc-card">
<h2>Fake Call Generator</h2>
<p class="fc-sub">Buat screenshot panggilan palsu</p>
<label class="fc-label">URL Foto Profil</label>
<input id="fcPp" class="fc-input" type="url" placeholder="https://example.com/pp.jpg" autocomplete="off">
<label class="fc-label">Nama Penelepon</label>
<input id="fcName" class="fc-input" type="text" placeholder="Nama" autocomplete="off">
<div class="fc-row">
<div>
<label class="fc-label">Durasi (detik)</label>
<input id="fcDur" class="fc-input" type="number" value="19" min="1" max="999">
</div>
</div>
<button id="fcBtn" class="fc-btn">🚀 Buat Fake Call</button>
<div id="fcLoading" class="fc-loading"><div class="fc-spinner"></div>Memproses...</div>
<div id="fcResult" class="fc-result"></div>
<img id="fcImg" class="fc-img" alt="Fake Call Result">
</div>
</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var btn=$('fcBtn'),pp=$('fcPp'),name=$('fcName'),dur=$('fcDur'),result=$('fcResult'),loading=$('fcLoading'),img=$('fcImg');
function showStatus(type,msg){result.className='fc-result show '+type;result.textContent=msg}
function hide(){result.className='fc-result';loading.className='fc-loading';img.className='fc-img'}
btn.onclick=async function(){
var ppurl=pp.value.trim(),nm=name.value.trim()||'Unknown',d=dur.value||'19';
if(!ppurl){showStatus('err','❌ URL foto profil tidak boleh kosong');return}
hide();loading.className='fc-loading show';btn.disabled=true;btn.textContent='⏳ Memproses...';
try{
var r=await fetch('/api/fakecall-proxy?ppurl='+encodeURIComponent(ppurl)+'&name='+encodeURIComponent(nm)+'&duration='+encodeURIComponent(d));
if(!r.ok)throw new Error('Gagal membuat fake call');
var blob=await r.blob();
var objUrl=URL.createObjectURL(blob);
img.src=objUrl;img.className='fc-img show';
showStatus('ok','✅ Berhasil! Fake call berhasil dibuat');
}catch(e){
showStatus('err','❌ Gagal: '+e.message);
}finally{
btn.disabled=false;btn.textContent='🚀 Buat Fake Call';
loading.className='fc-loading';
}
};
})();
</script>
</body>
</html>
